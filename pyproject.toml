[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unit_distances_in_convex_position"
version = "1.0.0"
description = "Rigorous structural investigation of the Erdos-Moser problem: unit distances among vertices of a convex polygon"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "rajveersinh-is-dev"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/rajveersinh-is-dev/unit-distances-in-convex-position"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
